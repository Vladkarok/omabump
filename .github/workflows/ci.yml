name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n
        run: for f in bin/omabump-common bin/omabump-check bin/omabump-install bin/omabump-prompt tests/run.sh; do bash -n "$f"; done
      - name: python
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile bin/omabump-discover
      - name: JSON
        run: for f in manifest.json apps.json pins.json; do jq . "$f" >/dev/null; done
      - name: shellcheck
        run: docker run --rm -v "$PWD":/mnt koalaman/shellcheck:stable bin/omabump-common bin/omabump-check bin/omabump-install bin/omabump-prompt tests/run.sh

  test:
    # The suite compares versions with vercmp, which comes with pacman.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed git jq python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests/run.sh
        run: tests/run.sh

  # A release tag must name the version manifest.json carries, have a
  # CHANGELOG entry, and sit on a commit whose lint and tests pass.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, manifest and changelog agree
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $(jq -r .version manifest.json) == "$version" ]] || { echo "manifest.json is not $version"; exit 1; }
          awk -v v="$version" '$1 == "##" && $2 == v { found = 1 } END { exit !found }' CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' entry"; exit 1; }
